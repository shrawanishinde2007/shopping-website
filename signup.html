<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | H.M Clothes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="signup">

  <div id="site-header"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-side">
        <h2>Join H.M Clothes today</h2>
        <ul>
          <li>🎁 Extra 10% off on your first order</li>
          <li>✔ Early access to sales</li>
          <li>✔ Easy returns and exchanges</li>
          <li>✔ Personalised recommendations</li>
        </ul>
      </div>
      <form class="auth-form" id="authForm" novalidate>
        <h1>Create Account</h1>
        <p class="sub">It only takes a minute.</p>

        <div class="field">
          <label for="suName">Full name</label>
          <input type="text" id="suName" placeholder="Your full name" autocomplete="name">
          <span class="err"></span>
        </div>
        <div class="field">
          <label for="suMobile">Mobile number</label>
          <input type="tel" id="suMobile" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" autocomplete="tel">
          <span class="err"></span>
        </div>
        <div class="field">
          <label for="suEmail">Email</label>
          <input type="email" id="suEmail" placeholder="you@example.com" autocomplete="email">
          <span class="err"></span>
        </div>
        <div class="field">
          <label for="suPw">Password</label>
          <input type="password" id="suPw" placeholder="At least 6 characters with a number" autocomplete="new-password">
          <button type="button" class="eye" aria-label="Show password">👁️</button>
          <span class="err"></span>
        </div>
        <div class="field">
          <label for="suCpw">Confirm password</label>
          <input type="password" id="suCpw" placeholder="Re-enter password" autocomplete="new-password">
          <button type="button" class="eye" aria-label="Show password">👁️</button>
          <span class="err"></span>
        </div>

        <button class="btn btn-primary btn-block" type="submit">Create Account</button>
        <p class="switch">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
